services:

  # -------------------------------------------------------
  # Banco de dados PostgreSQL
  # -------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cidades_esg}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      # Volume nomeado: os dados sobrevivem a "docker compose down".
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cidades-esg-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-cidades_esg}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # -------------------------------------------------------
  # API .NET 8
  # -------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: ${API_IMAGE:-cidades-esg-api:local}
    restart: unless-stopped
    depends_on:
      db:
        # A API so inicia depois que o healthcheck do banco passar.
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # "db" e o nome do servico: o DNS interno da rede Docker resolve para o container.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cidades_esg}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - cidades-esg-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  postgres-data:

networks:
  cidades-esg-net:
    driver: bridge
