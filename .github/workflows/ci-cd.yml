name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serializa os deploys das duas branches: staging nao muda durante a promocao.
  group: cidades-esg-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  build-e-testes:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Testes xUnit
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=resultado-testes.trx" --logger "console;verbosity=detailed" --results-directory ./resultados-testes
      - name: Testar verificador de deploy
        run: |
          set -o pipefail
          mkdir -p resultados-testes
          python3 -m unittest discover -s scripts -p "test_*.py" -v 2>&1 | tee resultados-testes/python.log
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: resultados-testes/
          retention-days: 30

  imagem-docker:
    name: Imagem e integracao com PostgreSQL
    needs: build-e-testes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tags.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Nome da imagem
        id: tags
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Autenticar GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir imagem
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
          tags: ${{ steps.tags.outputs.image }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Subir API e banco; verificar integracao
        env:
          API_IMAGE: ${{ steps.tags.outputs.image }}:${{ github.sha }}
          DB_PASSWORD: ci-ephemeral-password
          ASPNETCORE_ENVIRONMENT: Staging
        run: |
          docker compose -p ci config --quiet
          docker compose -p ci up -d --no-build --wait --wait-timeout 180
          python3 scripts/smoke_test.py --url http://localhost:8080 --environment Staging --version "$GITHUB_SHA" --attempts 3 --output docs/evidencias/ci-smoke.json
          python3 scripts/verify_compose.py --version "$GITHUB_SHA"
      - name: Guardar logs dos containers
        if: always()
        env:
          DB_PASSWORD: ci-ephemeral-password
        run: docker compose -p ci logs --no-color > docs/evidencias/ci-containers.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integracao-docker
          path: docs/evidencias/ci-*
      - name: Encerrar containers de CI
        if: always()
        env:
          DB_PASSWORD: ci-ephemeral-password
        run: docker compose -p ci down -v

  deploy-staging:
    name: Deploy staging
    needs: imagem-docker
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy da imagem validada e smoke test
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}
          URL_BASE: ${{ vars.STAGING_URL }}
          IMAGE_REF: ${{ needs.imagem-docker.outputs.image }}@${{ needs.imagem-docker.outputs.digest }}
        run: |
          python3 scripts/deploy_render.py --environment Staging --version "$GITHUB_SHA" --output docs/evidencias/staging.json
      - name: Guardar evidencia do deploy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-staging
          path: docs/evidencias/staging.json

  deploy-production:
    name: Deploy production
    needs: [imagem-docker, deploy-staging]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy da imagem validada e smoke test
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}
          URL_BASE: ${{ vars.PRODUCTION_URL }}
          IMAGE_REF: ${{ needs.imagem-docker.outputs.image }}@${{ needs.imagem-docker.outputs.digest }}
        run: |
          python3 scripts/deploy_render.py --environment Production --version "$GITHUB_SHA" --output docs/evidencias/production.json
      - name: Guardar evidencia do deploy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-production
          path: docs/evidencias/production.json

